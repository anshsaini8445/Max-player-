name: Max Player Multi-Model AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autonomous-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 120 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet openai httpx

      - name: Multi-Model AI Engine (DeepSeek -> Nemotron -> Mistral)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from openai import OpenAI
          import httpx

          API_KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY: 
              print("❌ Missing NVIDIA_API_KEY")
              sys.exit(1)

          # 90 SECONDS TIMEOUT ONLY: No more hanging for 40 minutes!
          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1", 
              api_key=API_KEY, 
              http_client=httpx.Client(timeout=90.0)
          )
          
          # Jaisa aapne kaha: Ek fail to dusra, dusra fail to teesra
          ai_models_relay = [
              "deepseek-ai/deepseek-v4.1-flash",   # Pehli pasand
              "nvidia/nemotron-4-340b-instruct",   # Dusra (NVIDIA ka apna)
              "mistralai/mistral-large-2-instruct",# Teesra (Mistral AI)
              "meta/llama-3.1-70b-instruct"        # Chautha (Backup)
          ]
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle", ".idea"}
          
          def get_project_files():
              files = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed:
                      try: files.append(f"File: {p.relative_to(PROJECT_DIR).as_posix()}\nContent:\n{p.read_text(encoding='utf-8')[:3000]}")
                      except: pass
              return "\n---\n".join(files[:50])

          base_prompt = f"""
          You are an Elite Android Master Developer. 
          Task: Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Codebase Context:
          {get_project_files()}
          
          CRITICAL RULES:
          1. Return ONLY a pure JSON object. No markdown text outside.
          2. Format: {{"summary": "...", "files": [{{"filepath": "...", "content": "..."}}]}}
          3. Provide FULL code for changed files. DO NOT break existing Video functionality.
          """

          success = False
          
          # LOOP 1: Iterate through models
          for model_name in ai_models_relay:
              if success: break
              print(f"\n==================================================")
              print(f"🚀 ACTIVATING AI MODEL: {model_name}")
              print(f"==================================================")
              
              current_prompt = base_prompt
              
              # LOOP 2: 3 chances for the current model to get it right
              for attempt in range(3):
                  try:
                      print(f"🔄 Attempt {attempt+1}/3 with {model_name}...")
                      completion = client.chat.completions.create(
                          model=model_name, 
                          messages=[{"role": "user", "content": current_prompt}], 
                          temperature=0.1
                      )
                      response_text = completion.choices[0].message.content
                      
                      clean_text = response_text.strip()
                      if "```json" in clean_text: clean_text = clean_text.split("```json")[1].split("```")[0]
                      elif "```" in clean_text: clean_text = clean_text.split("```")[1].split("```")[0]
                          
                      match = re.search(r"\{[\s\S]*\}", clean_text.strip())
                      if not match: raise ValueError("Invalid JSON")
                      
                      data = json.loads(match.group(0))
                      
                      for item in data.get("files", []):
                          target = (PROJECT_DIR / item["filepath"]).resolve()
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(item["content"], encoding="utf-8")
                          print(f"💾 File Updated: {item['filepath']}")
                          
                      print("⚙️ Compiling App...")
                      build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                      
                      if build.returncode == 0:
                          print("🟢 BUILD SUCCESSFUL! AI code is flawless.")
                          success = True
                          break
                      else:
                          print("🔴 BUILD FAILED! Telling AI to fix its error...")
                          subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                          subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR, capture_output=True)
                          current_prompt = base_prompt + f"\n\n🚨 FIX THIS COMPILE ERROR:\n{build.stderr[-1500:]}"
                          
                  except Exception as e:
                      print(f"⚠️ {model_name} FAILED or TIMED OUT: {e}")
                      print(f"⏭️️ Skipping {model_name} and moving to the next model...")
                      subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                      break # Break the attempt loop to move to the NEXT MODEL in the outer loop
                      
          if not success:
              print("❌ ALL MODELS (DeepSeek, Nemotron, Mistral, Llama) FAILED.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save & Push Code
        if: success()
        run: |
          git config user.name "Multi-Model-AI"
          git config user.email "ai@maxplayer.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI Built Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
