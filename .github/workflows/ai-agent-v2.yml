name: Ultimate God-Mode AI Developer

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ai-developer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google GenAI
        run: pip install --quiet google-genai

      - name: RUN GOD-MODE AI AGENT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          if not API_KEY: 
              print("ERROR: Missing API KEY")
              sys.exit(1)
          
          client = genai.Client(api_key=API_KEY)
          
          # STRICTLY MEMORIZED 2026 MODELS - AS REQUESTED
          models_pool = [
              "gemini-3.1-pro",
              "gemini-3.8-flash",
          ]
          
          allowed_exts = {".kt", ".xml", ".gradle"}
          blocked_dirs = {".git", ".github", "build", "gradle"}
          
          def get_current_files():
              files_data = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked_dirs) and p.suffix.lower() in allowed_exts:
                      try: 
                          content = p.read_text(encoding='utf-8')
                          files_data.append(f"--- FILE: {p.relative_to(PROJECT_DIR).as_posix()} ---\n{content}")
                      except: pass
              return "\n".join(files_data)

          initial_prompt = f"""
          Task: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Project Files (Context):
          {get_current_files()}
          
          CRITICAL DIRECTIVES FOR AI:
          1. Return ONLY valid JSON: {{"files": [{{"filepath": "...", "content": "..."}}]}}
          2. ALL CODE MUST BE IN PURE ENGLISH. No other languages allowed.
          3. NEVER USE PLACEHOLDERS. Return the ENTIRE updated file content.
          4. DO NOT DELETE EXISTING FEATURES. Append your code carefully.
          """
          
          current_prompt = initial_prompt
          max_iterations = 12
          success = False
          
          # API SAFETY SYSTEM: To prevent 429 and 403 errors
          base_wait_time = 15 # Start with a 15-second wait if we hit an error
          
          for attempt in range(1, max_iterations + 1):
              if not models_pool:
                  print("FATAL ERROR: All AI models were rejected.")
                  break
                  
              current_model = models_pool[0]
              print(f"\n==================================================")
              print(f"[ATTEMPT {attempt}/{max_iterations}] Using Model: {current_model}")
              
              # Add a mandatory small delay between requests to avoid hitting rate limits too fast
              if attempt > 1:
                 time.sleep(5)
              
              try:
                  res = client.models.generate_content(
                      model=current_model,
                      contents=current_prompt,
                      config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.1)
                  )
                  
                  clean_text = res.text.strip()
                  if clean_text.startswith("```json"): clean_text = clean_text[7:]
                  if clean_text.startswith("```"): clean_text = clean_text[3:]
                  if clean_text.endswith("```"): clean_text = clean_text[:-3]
                  
                  data = json.loads(clean_text.strip())
                  files_to_process = data if isinstance(data, list) else data.get("files", [])
                  
                  if not files_to_process:
                      raise ValueError("Empty file list returned.")

                  valid_writes = 0
                  for item in files_to_process:
                      if isinstance(item, dict) and item.get("filepath") and item.get("content"):
                          fp = item["filepath"]
                          if "dummy" in fp.lower() or "example" in fp.lower(): continue
                          
                          target = (PROJECT_DIR / fp).resolve()
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(item["content"], encoding="utf-8")
                          print(f"File Edited Successfully: {fp}")
                          valid_writes += 1
                  
                  if valid_writes == 0:
                      raise ValueError("No valid files written.")

                  # Check if AI actually changed code
                  git_status_check = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True)
                  if not git_status_check.stdout.strip():
                      print("WARNING: AI returned the exact same code.")
                      current_prompt = "You returned the exact same code. You MUST modify the code to implement the features. Return valid JSON."
                      time.sleep(3)
                      continue
                      
                  # Compile check
                  print("Compiling code to check for errors...")
                  build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                  
                  if build.returncode == 0:
                      print("SUCCESS: App compiled perfectly!")
                      success = True
                      break
                  else:
                      error_log = build.stderr[:2000]
                      print("BUILD FAILED: Syntax/Logic Error.")
                      current_prompt = f"Your code caused this Gradle Error. FIX IT and return full files:\n{error_log}"
                      subprocess.run(["git", "checkout", "--", "."])
                      subprocess.run(["git", "clean", "-fd"])
                      # Wait before retrying after a bad compile
                      time.sleep(10)
                      
              except Exception as e:
                  err_str = str(e)
                  print(f"API ERROR: {err_str}")
                  subprocess.run(["git", "checkout", "--", "."])
                  subprocess.run(["git", "clean", "-fd"])
                  
                  # SMART ERROR HANDLING & BAN SYSTEM
                  if "404" in err_str or "400" in err_str or "not found" in err_str.lower() or "invalid" in err_str.lower():
                      print(f"BANNING MODEL DUE TO PERMANENT ERROR: {current_model}")
                      models_pool.pop(0)
                      time.sleep(2)
                  elif "429" in err_str or "503" in err_str or "Quota" in err_str:
                      print(f"Quota Limit Hit. Sleeping for {base_wait_time} seconds to protect API key...")
                      time.sleep(base_wait_time)
                      # Increase wait time exponentially for the next potential error (15s -> 30s -> 60s -> 120s)
                      base_wait_time = min(base_wait_time * 2, 120) 
                      # Move the model to the back of the queue
                      models_pool.append(models_pool.pop(0))
                  elif "403" in err_str:
                      print("PERMISSION DENIED. The API Key might be blocked or missing permissions.")
                      # If 403 happens, waiting usually doesn't fix it immediately, but we wait to avoid spamming
                      time.sleep(30)
                      models_pool.append(models_pool.pop(0))
                  else:
                      current_prompt = "JSON format error. Return EXACTLY valid JSON."
                      time.sleep(5)
                      
          if success:
              print("BUILD SAVED SUCCESSFULLY.")
              sys.exit(0)
          else:
              print("AI FAILED COMPLETELY. ABORTING.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save and Commit
        if: success()
        run: |
          git config user.name "God-Mode Developer"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Solid Feature Integration" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
