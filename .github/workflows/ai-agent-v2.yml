name: Max Player NVIDIA God-Mode

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autonomous-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 120 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet openai httpx

      - name: The NVIDIA AI Engine (Self-Healing)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from openai import OpenAI
          import httpx

          API_KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY: 
              print("❌ Missing NVIDIA_API_KEY in GitHub Secrets")
              sys.exit(1)

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1", 
              api_key=API_KEY, 
              http_client=httpx.Client(timeout=300.0)
          )
          
          # Stable NVIDIA model endpoint
          model_name = "deepseek-ai/deepseek-v4.1-flash"
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle", ".idea"}
          
          def get_project_files():
              files_data = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed:
                      try: files_data.append(f"File: {p.relative_to(PROJECT_DIR).as_posix()}\nContent:\n{p.read_text(encoding='utf-8')[:3500]}")
                      except: pass
              return "\n---\n".join(files_data[:50])

          base_prompt = f"""
          You are an Elite Android Master Developer. 
          Task: Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Codebase Context (DO NOT BREAK EXISTING FEATURES):
          {get_project_files()}
          
          CRITICAL RULES:
          1. Return ONLY a pure JSON object. No Markdown, No text outside JSON.
          2. Format MUST be exactly: {{"summary": "What you did", "files": [{{"filepath": "app/src/.../File.kt", "content": "FULL_UPDATED_CODE"}}]}}
          3. You MUST provide the FULL code for any file you change. Do not use placeholders.
          """

          success = False
          current_prompt = base_prompt
          
          # Self-Healing Loop: 3 attempts to write and fix code if build fails
          for attempt in range(3):
              try:
                  print(f"🔄 Generation Attempt {attempt+1}/3 with {model_name}...")
                  completion = client.chat.completions.create(
                      model=model_name, 
                      messages=[{"role": "user", "content": current_prompt}], 
                      temperature=0.1
                  )
                  response_text = completion.choices[0].message.content
                  
                  clean_text = response_text.strip()
                  if "```json" in clean_text:
                      clean_text = clean_text.split("```json")[1].split("```")[0]
                  elif "```" in clean_text:
                      clean_text = clean_text.split("```")[1].split("```")[0]
                      
                  match = re.search(r"\{[\s\S]*\}", clean_text.strip())
                  if not match: raise ValueError("Invalid JSON format from AI")
                  
                  data = json.loads(match.group(0))
                  
                  for item in data.get("files", []):
                      target = (PROJECT_DIR / item["filepath"]).resolve()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(item["content"], encoding="utf-8")
                      print(f"💾 AI Wrote: {item['filepath']}")
                      
                  print("⚙️ Compiling App with AI Code...")
                  build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                  
                  if build.returncode == 0:
                      print("🟢 BUILD SUCCESSFUL! AI code is flawless.")
                      success = True
                      break
                  else:
                      error_log = build.stderr[-1500:]
                      print(f"🔴 BUILD FAILED! Sending error log back to AI for Self-Healing...")
                      subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                      subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR, capture_output=True)
                      current_prompt = base_prompt + f"\n\n🚨 YOUR PREVIOUS CODE FAILED TO COMPILE. FIX THIS EXACT ERROR:\n{error_log}\n\nDO NOT REPEAT THE MISTAKE. Output ONLY valid JSON with fixed code."
                      
              except Exception as e:
                  print(f"⚠️ Error: {e}")
                  subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                  subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR, capture_output=True)
                  time.sleep(5)
                  
          if not success:
              print("❌ AI FAILED TO FIX THE BUG AFTER 3 ATTEMPTS.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save & Push AI Code
        if: success()
        run: |
          git config user.name "Max-God-AI"
          git config user.email "ai@maxplayer.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Pilot: Built Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload AI-Built APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
