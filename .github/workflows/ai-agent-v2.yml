name: Max Player God-Mode AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autonomous-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 120 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet openai httpx

      - name: Multi-Model Autonomous Engine (Never Give Up)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from openai import OpenAI
          import httpx

          API_KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY: 
              print("❌ Missing NVIDIA_API_KEY")
              sys.exit(1)

          client = OpenAI(base_url="https://integrate.api.nvidia.com/v1", api_key=API_KEY, http_client=httpx.Client(timeout=180.0))
          
          # Duniya ke Top 3 Models (NVIDIA API par maujood)
          top_models = [
              "deepseek-ai/deepseek-v4.1-flash", 
              "nvidia/nemotron-4-340b-instruct",
              "meta/llama-3.1-405b-instruct"
          ]
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle", ".idea"}
          
          def get_project_files():
              files_data = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed:
                      try: files_data.append(f"File: {p.relative_to(PROJECT_DIR).as_posix()}\nContent:\n{p.read_text(encoding='utf-8')[:3000]}")
                      except: pass
              return "\n---\n".join(files_data[:50])

          base_prompt = f"""
          You are an Elite Android Master Developer.
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Codebase Context (CRITICAL: Do not break existing features):
          {get_project_files()}
          
          RULES:
          1. Return ONLY a pure JSON object. NO Markdown, NO conversational text.
          2. Format: {{"summary": "What you did", "files": [{{"filepath": "app/src/.../File.kt", "content": "FULL_UPDATED_CODE"}}]}}
          3. Provide COMPLETE code for modified files. Ensure 100% Kotlin/XML compilation.
          """

          success = False
          
          # Model Loop: Ek fail hoga toh dusra chalega
          for model_name in top_models:
              if success: break
              print(f"\n==================================================")
              print(f"🤖 ACTIVATING AI MODEL: {model_name}")
              print(f"==================================================")
              
              current_prompt = base_prompt
              
              # Self-Healing Loop: Har model ko 3 mauke milenge apni galti sudharne ke liye
              for attempt in range(3):
                  try:
                      print(f"🔄 Generation Attempt {attempt+1}/3 with {model_name}...")
                      completion = client.chat.completions.create(
                          model=model_name, 
                          messages=[{"role": "user", "content": current_prompt}], 
                          temperature=0.1
                      )
                      response_text = completion.choices[0].message.content
                      
                      # Clean JSON
                      clean_text = response_text.strip()
                      if clean_text.startswith("```json"): clean_text = clean_text[7:]
                      if clean_text.startswith("```"): clean_text = clean_text[3:]
                      if clean_text.endswith("```"): clean_text = clean_text[:-3]
                      match = re.search(r"\{[\s\S]*\}", clean_text.strip())
                      if not match: raise ValueError("No JSON found")
                      
                      data = json.loads(match.group(0))
                      
                      # Save Files
                      for item in data.get("files", []):
                          target = (PROJECT_DIR / item["filepath"]).resolve()
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(item["content"], encoding="utf-8")
                          
                      print("⚙️ Compiling App with AI Code...")
                      build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                      
                      if build.returncode == 0:
                          print("🟢 BUILD SUCCESSFUL! AI code is flawless.")
                          success = True
                          break # Break self-healing loop
                      else:
                          error_log = build.stderr[-1500:]
                          print(f"🔴 BUILD FAILED! Sending error back to AI to fix it (Self-Healing)...")
                          # Git reset to clear bad files before AI tries again
                          subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                          subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR, capture_output=True)
                          
                          # Adding the error to the prompt so AI can fix its own mistake
                          current_prompt = base_prompt + f"\n\n🚨 PREVIOUS ATTEMPT FAILED WITH COMPILATION ERROR:\n{error_log}\n\nFIX THIS ERROR and provide the corrected FULL JSON."
                          
                  except Exception as e:
                      print(f"⚠️ Error with {model_name}: {e}")
                      subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                      subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR, capture_output=True)
                      time.sleep(5)
                      break # If API fails, break attempt loop and move to NEXT MODEL
                      
          if not success:
              print("❌ ALL MODELS FAILED AFTER MULTIPLE ATTEMPTS.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save & Push Safe Code
        if: success()
        run: |
          git config user.name "Max-God-AI"
          git config user.email "ai@maxplayer.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Pilot (God Mode): Fixed Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload Safe APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-Ultimate-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
