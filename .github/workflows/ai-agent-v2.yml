name: Ultimate MaxPlayer AI V6

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 2026 Latest Android Base Setup
        run: |
          echo "Setting up perfect Android base project..."
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MaxPlayer'
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.app.mediaplayer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.app.mediaplayer">
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Secure Packages
        run: pip install --quiet openai httpx

      - name: Run Auto-Switch AI
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYEOF' > run_ai.py
          import os, sys, json, re, subprocess, time
          from pathlib import Path
          from openai import OpenAI
          import httpx

          api_key = os.environ.get("NVIDIA_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          body = os.environ.get("ISSUE_BODY", "") or ""
          issue_no = os.environ.get("ISSUE_NUMBER", "")

          if not api_key:
              print("FATAL: NVIDIA_API_KEY missing!")
              sys.exit(1)

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=api_key,
              http_client=httpx.Client(timeout=300.0)
          )

          # Auto-Switch Models: DeepSeek pehle, Nemotron backup
          ai_models = [
              "deepseek-ai/deepseek-v4.1-flash",
              "meta/llama-3.1-70b-instruct",
              "nvidia/llama-3.1-nemotron-70b-instruct"
          ]

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle", "node_modules", ".idea", ".github"}]
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".properties")):
                      all_files.append(os.path.relpath(os.path.join(root, f), "."))

          file_list_str = "\n".join(sorted(all_files)[:150])

          base_prompt = f"""You are an elite autonomous Android engineer.
          Project Files:
          {file_list_str}

          Issue #{issue_no}: {title}
          Details: {body}

          RULES:
          1. Return fully compilable Kotlin/XML.
          2. STRICT JSON format only: {{"summary": "info", "files": [{{"filepath": "path/file.kt", "content": "CODE"}}]}}
          """

          current_prompt = base_prompt
          build_success = False

          for attempt in range(1, 4):
              print(f"\n--- AI ATTEMPT {attempt} ---")
              response_text = None
              
              for model_name in ai_models:
                  for retry in range(2): 
                      try:
                          print(f"Connecting to {model_name}...")
                          completion = client.chat.completions.create(
                              model=model_name,
                              messages=[{"role": "user", "content": current_prompt}],
                              temperature=0.1
                          )
                          if completion and completion.choices:
                              response_text = completion.choices[0].message.content
                              print(f"✅ {model_name} Responded!")
                              break
                      except Exception as e:
                          print(f"✗ Failed: {e}")
                          print("Retrying in 10s...")
                          time.sleep(10)
                  if response_text:
                      break
              
              if not response_text:
                  print("FATAL: All AI servers down or quota exhausted.")
                  sys.exit(1)

              raw_text = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', response_text.strip())
              
              try:
                  match = re.search(r"\{[\s\S]*\}", raw_text)
                  data = json.loads(match.group(0)) if match else json.loads(raw_text)
              except:
                  print("FATAL: Invalid JSON.")
                  sys.exit(1)

              for item in data.get("files", []):
                  fp = item.get("filepath", "").strip().replace("\\", "/")
                  if fp.startswith("./"): fp = fp[2:]
                  if ".." in fp or fp.startswith("/"): continue
                  Path(fp).parent.mkdir(parents=True, exist_ok=True)
                  with open(fp, "w", encoding="utf-8") as f:
                      f.write(item.get("content", ""))
                  print(f"📝 Wrote: {fp}")

              with open("agent_summary.txt", "w", encoding="utf-8") as f:
                  f.write(data.get("summary", f"AI Fix attempt {attempt}"))

              print("\n🔨 Compiling (assembleDebug)...")
              build_process = subprocess.run(
                  ["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], 
                  capture_output=True, text=True
              )
              
              if build_process.returncode == 0:
                  print("✅ BUILD SUCCESSFUL!")
                  build_success = True
                  break
              else:
                  print("❌ BUILD FAILED — self-healing...")
                  error_log = build_process.stderr + build_process.stdout
                  short_error = error_log[-2000:]
                  current_prompt = base_prompt + f"\n\nCRITICAL FIX NEEDED: Compilation failed. Error log:\n```\n{short_error}\n```\nProvide corrected FULL JSON."

          if not build_success:
              print("❌ FATAL: Self-healing failed.")
              sys.exit(1)
          PYEOF
          
          python run_ai.py

      - name: Save Code to Main Branch
        run: |
          git config --global user.name "AI-Agent[bot]"
          git config --global user.email "ai-agent@google.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            SUMMARY=$(cat agent_summary.txt 2>/dev/null || echo "AI Magic Update")
            git commit -m "Auto-Fix: Issue #${{ github.event.issue.number }} - $SUMMARY"
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ **Done!** AI Agent successfully generated and built the APK. Download it from Artifacts.'
              : '❌ **Failed.** AI hit a snag. Check action logs.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
