name: Strict Terminator AI Developer

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ai-developer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google GenAI
        run: pip install --quiet google-genai

      - name: RUN STRICT TERMINATOR AI AGENT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          if not API_KEY: 
              print("ERROR: Missing API KEY")
              sys.exit(1)
          
          client = genai.Client(api_key=API_KEY)
          
          # Updated Memory: Pro (3.1), Flash (3.8), Flash-Lite (3.5), and Extended/Thinking Model
          models_pool = [
              "gemini-3.1-pro",
              "gemini-3.8-flash",
              "gemini-2.0-flash-thinking-exp", # The Extended/Thinking model
              "gemini-3.5-flash-lite"
          ]
          model_idx = 0
          
          allowed_exts = {".kt", ".xml", ".gradle"}
          blocked_dirs = {".git", ".github", "build", "gradle"}
          
          def get_current_files():
              files_data = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked_dirs) and p.suffix.lower() in allowed_exts:
                      try: 
                          content = p.read_text(encoding='utf-8')
                          files_data.append(f"--- FILE: {p.relative_to(PROJECT_DIR).as_posix()} ---\n{content}")
                      except: pass
              return "\n".join(files_data)

          initial_prompt = f"""
          Task: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Project Files (Context):
          {get_current_files()}
          
          CRITICAL DIRECTIVES FOR AI:
          1. Return ONLY valid JSON in this exact format: {{"files": [{{"filepath": "...", "content": "..."}}]}}
          2. ALL CODE MUST BE IN ENGLISH. Do not use Hindi or any other language in the code, comments, or XML files.
          3. NEVER USE PLACEHOLDERS (e.g., "// existing code here"). You MUST return the ENTIRE updated file content.
          4. PRESERVE EXISTING LOGIC. If you delete existing features, the build will fail.
          """
          
          current_prompt = initial_prompt
          max_iterations = 10
          success = False
          
          for attempt in range(1, max_iterations + 1):
              current_model = models_pool[model_idx % len(models_pool)]
              print(f"\n==================================================")
              print(f"[ATTEMPT {attempt}/{max_iterations}] Using Model: {current_model}")
              
              try:
                  res = client.models.generate_content(
                      model=current_model,
                      contents=current_prompt,
                      config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.1)
                  )
                  
                  clean_text = res.text.strip()
                  if clean_text.startswith("```json"): clean_text = clean_text[7:]
                  if clean_text.startswith("```"): clean_text = clean_text[3:]
                  if clean_text.endswith("```"): clean_text = clean_text[:-3]
                  
                  data = json.loads(clean_text.strip())
                  files_to_process = data if isinstance(data, list) else data.get("files", [])
                  
                  if not files_to_process:
                      raise ValueError("Empty file list returned by AI.")

                  valid_writes = 0
                  for item in files_to_process:
                      if isinstance(item, dict) and item.get("filepath") and item.get("content"):
                          fp = item["filepath"]
                          if "dummy" in fp.lower() or "example" in fp.lower(): continue
                          
                          target = (PROJECT_DIR / fp).resolve()
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(item["content"], encoding="utf-8")
                          print(f"File modified by AI: {fp}")
                          valid_writes += 1
                  
                  if valid_writes == 0:
                      raise ValueError("No valid files were written.")

                  # STRICT CHECK: Verify if AI actually changed or added any code
                  git_status_check = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True)
                  if not git_status_check.stdout.strip():
                      print("WARNING: AI returned the exact same code. No changes detected.")
                      current_prompt = "You returned the exact same code. You MUST implement the requested features and modify the code appropriately. Ensure valid JSON output."
                      time.sleep(5)
                      continue
                      
                  # Compile check
                  print("Compiling the new AI code...")
                  build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                  
                  if build.returncode == 0:
                      print("SUCCESS: Code compiled without errors.")
                      success = True
                      break
                  else:
                      error_log = build.stderr[:2500]
                      print("BUILD FAILED: AI made a syntax error.")
                      
                      current_prompt = f"""
                      Your previous code caused this Gradle Error. FIX IT and return the full corrected files.
                      ERROR LOG:
                      {error_log}
                      """
                      subprocess.run(["git", "checkout", "--", "."])
                      subprocess.run(["git", "clean", "-fd"])
                      time.sleep(10)
                      
              except Exception as e:
                  print(f"SYSTEM ERROR: {str(e)}")
                  subprocess.run(["git", "checkout", "--", "."])
                  subprocess.run(["git", "clean", "-fd"])
                  
                  if "429" in str(e) or "503" in str(e) or "Quota" in str(e):
                      print("Switching model due to Quota/Traffic limit...")
                      model_idx += 1
                      time.sleep(15)
                  else:
                      current_prompt = "Invalid JSON format. Return EXACTLY valid JSON format without truncation."
                      time.sleep(5)
                      
          if success:
              print("ALL CHECKS PASSED. Saving to repository.")
              sys.exit(0)
          else:
              print("FATAL ERROR: AI failed after 10 attempts. Aborting workflow.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save and Commit AI Code
        if: success()
        run: |
          git config user.name "Strict AI Developer"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Feature properly integrated by AI" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
