name: Build MAX Player Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # This allows you to run the build manually from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK (God-Mode Engine)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
