name: Max Player Auto-Scanner AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autonomous-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 120 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet openai httpx

      - name: Dynamic Auto-Scanner AI Engine
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from openai import OpenAI
          import httpx

          API_KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY: 
              print("❌ Missing NVIDIA_API_KEY")
              sys.exit(1)

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1", 
              api_key=API_KEY, 
              http_client=httpx.Client(timeout=120.0)
          )
          
          # HACKER MODE: Scan NVIDIA for LIVE models available to YOUR new key
          print("🔍 Scanning NVIDIA Server for active models...")
          try:
              headers = {"Authorization": f"Bearer {API_KEY}"}
              resp = httpx.get("https://integrate.api.nvidia.com/v1/models", headers=headers, timeout=15.0)
              resp.raise_for_status()
              models_data = resp.json().get("data", [])
              
              # Find all live models that end with 'instruct' or 'chat'
              live_models = [m["id"] for m in models_data if "instruct" in m["id"].lower() or "chat" in m["id"].lower()]
              
              if not live_models:
                  raise ValueError("No instruct models found.")
          except Exception as e:
              print(f"⚠️ Dynamic scan failed ({e}). Using ultra-safe fallback models.")
              live_models = [
                  "nvidia/llama-3.1-nemotron-70b-instruct",
                  "meta/llama-3.2-90b-vision-instruct",
                  "mistralai/mistral-large-2-instruct",
                  "deepseek-ai/deepseek-v4.1-flash"
              ]

          # Limit to top 4 models to save time in the relay
          ai_models_relay = live_models[:4]
          print(f"✅ Found Active Models for your Key! Relay Order: {ai_models_relay}")
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle", ".idea"}
          
          def get_project_files():
              files = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed:
                      try: files.append(f"File: {p.relative_to(PROJECT_DIR).as_posix()}\nContent:\n{p.read_text(encoding='utf-8')[:3500]}")
                      except: pass
              return "\n---\n".join(files[:50])

          base_prompt = f"""
          You are an Elite Android Master Developer. 
          Task: Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Codebase Context:
          {get_project_files()}
          
          CRITICAL RULES:
          1. Return ONLY a pure JSON object. No markdown text outside.
          2. Format: {{"summary": "...", "files": [{{"filepath": "...", "content": "..."}}]}}
          3. Provide FULL code for changed files. DO NOT break existing Video functionality.
          """

          success = False
          
          for model_name in ai_models_relay:
              if success: break
              print(f"\n==================================================")
              print(f"🚀 ACTIVATING AI MODEL: {model_name}")
              print(f"==================================================")
              
              current_prompt = base_prompt
              
              for attempt in range(2): # 2 chances per model
                  try:
                      print(f"🔄 Attempt {attempt+1}/2 with {model_name}...")
                      completion = client.chat.completions.create(
                          model=model_name, 
                          messages=[{"role": "user", "content": current_prompt}], 
                          temperature=0.1
                      )
                      response_text = completion.choices[0].message.content
                      
                      clean_text = response_text.strip()
                      if "```json" in clean_text: clean_text = clean_text.split("```json")[1].split("```")[0]
                      elif "```" in clean_text: clean_text = clean_text.split("```")[1].split("```")[0]
                          
                      match = re.search(r"\{[\s\S]*\}", clean_text.strip())
                      if not match: raise ValueError("Invalid JSON")
                      
                      data = json.loads(match.group(0))
                      
                      for item in data.get("files", []):
                          target = (PROJECT_DIR / item["filepath"]).resolve()
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(item["content"], encoding="utf-8")
                          print(f"💾 File Updated: {item['filepath']}")
                          
                      print("⚙️ Compiling App...")
                      build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                      
                      if build.returncode == 0:
                          print("🟢 BUILD SUCCESSFUL! AI code is flawless.")
                          success = True
                          break
                      else:
                          print("🔴 BUILD FAILED! Telling AI to fix its error...")
                          subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                          subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR, capture_output=True)
                          current_prompt = base_prompt + f"\n\n🚨 FIX THIS COMPILE ERROR:\n{build.stderr[-1500:]}"
                          
                  except Exception as e:
                      print(f"⚠️ {model_name} FAILED: {e}")
                      print(f"⏭ Skipping moving to the next model...")
                      subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR, capture_output=True)
                      break 
                      
          if not success:
              print("❌ ALL MODELS FAILED.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save & Push Code
        if: success()
        run: |
          git config user.name "Auto-Scanner-AI"
          git config user.email "ai@maxplayer.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI Built Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
