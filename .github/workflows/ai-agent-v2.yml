name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-ai-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 90 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet openai httpx

      - name: The Ultimate AI Engine (Self-Healing)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from openai import OpenAI
          import httpx

          API_KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY: 
              print("❌ Missing NVIDIA_API_KEY")
              sys.exit(1)

          # High timeout for heavy and smart code generation
          client = OpenAI(base_url="[https://integrate.api.nvidia.com/v1](https://integrate.api.nvidia.com/v1)", api_key=API_KEY, http_client=httpx.Client(timeout=300.0))
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle", ".idea"}
          
          def get_project_files():
              files_data = []
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed:
                      try:
                          files_data.append(f"File: {p.relative_to(PROJECT_DIR).as_posix()}\nContent:\n{p.read_text(encoding='utf-8')[:3000]}")
                      except: pass
              return "\n---\n".join(files_data[:40])

          prompt = f"""
          You are an Elite Android Master Developer building a PlayStore-ready app 'Max Player'.
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          
          Current Codebase Context (CRITICAL: Do not break existing features like the ExoPlayer or Video List):
          {get_project_files()}
          
          CRITICAL RULES:
          1. Return ONLY a pure JSON object. NO Markdown, NO ```json blocks, NO conversational text.
          2. The JSON format MUST be strictly: {{"summary": "What you did", "files": [{{"filepath": "app/src/.../File.kt", "content": "FULL_UPDATED_CODE"}}]}}
          3. Provide the COMPLETE code for the modified files. NEVER use placeholders like "// rest of code".
          4. Ensure 100% Kotlin/XML compilation.
          """
          
          model_name = "deepseek-ai/deepseek-v4.1-flash"
          response_text = None
          
          for retry in range(3):
              try:
                  print(f"🚀 Connecting to AI Brain (Attempt {retry+1}/3)...")
                  completion = client.chat.completions.create(
                      model=model_name, 
                      messages=[{"role": "user", "content": prompt}], 
                      temperature=0.1,
                      max_tokens=8000
                  )
                  response_text = completion.choices[0].message.content
                  print("✅ AI response received!")
                  break
              except Exception as e:
                  print(f"⚠️ Server busy, retrying in 15s... Error: {e}")
                  time.sleep(15)
                      
          if not response_text:
              print("❌ AI Server Timeout after all retries.")
              sys.exit(1)
              
          try:
              # Aggressive JSON extraction (Fixes all markdown errors)
              clean_text = response_text.strip()
              if clean_text.startswith("```json"): clean_text = clean_text[7:]
              if clean_text.startswith("```"): clean_text = clean_text[3:]
              if clean_text.endswith("```"): clean_text = clean_text[:-3]
              clean_text = clean_text.strip()
              
              match = re.search(r"\{[\s\S]*\}", clean_text)
              if not match: raise ValueError("No JSON object found in AI response")
              
              data = json.loads(match.group(0))
              
              print(f"📝 AI Summary: {data.get('summary', 'Applying updates...')}")
              
              for item in data.get("files", []):
                  target = (PROJECT_DIR / item["filepath"]).resolve()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(item["content"], encoding="utf-8")
                  print(f"💾 Updated: {item['filepath']}")
                  
              print("⚙️ Compiling App with new AI code...")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              
              if build.returncode == 0:
                  print("🟢 BUILD SUCCESSFUL! AI code is perfect.")
                  sys.exit(0)
              else:
                  print("🔴 BUILD FAILED! AI made a mistake.")
                  print("⏪ REVERTING REPOSITORY TO PREVIOUS SAFE STATE...")
                  subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR)
                  subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR)
                  print("🛡️ Repository saved from breaking. The issue needs to be refined.")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ JSON Formatting Error: {e}")
              print("⏪ Reverting partial changes...")
              subprocess.run(["git", "reset", "--hard"], cwd=PROJECT_DIR)
              subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR)
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save & Push Code
        if: success()
        run: |
          git config user.name "Max-AI-Brain"
          git config user.email "ai@maxplayer.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Pilot: Fixed Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload Safe APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-Ultimate-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
