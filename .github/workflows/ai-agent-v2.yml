name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: ALL-IN-ONE FIX (List + Player Force Build)
        run: |
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout

          # 1. Video Data Class (Yeh pichli baar miss ho gaya tha)
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/Video.kt
          package com.app.mediaplayer
          data class Video(val id: Long, val title: String, val path: String, val duration: Long)
          EOF

          # 2. List Item Layout
          cat << 'EOF' > app/src/main/res/layout/item_video.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="horizontal" android:padding="12dp" android:background="#0A0A0A">
              <ImageView android:layout_width="80dp" android:layout_height="60dp" android:background="#333333" />
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_marginLeft="12dp" android:layout_gravity="center_vertical">
                  <TextView android:id="@+id/tvTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="16sp" android:maxLines="2" android:ellipsize="end"/>
                  <TextView android:id="@+id/tvDuration" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#00FFCC" android:textSize="14sp" android:layout_marginTop="4dp"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 3. Main Screen Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#000000">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Max Player" android:textColor="#00FFCC" android:textSize="22sp" android:textStyle="bold" android:padding="16dp" android:background="#111111"/>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/recyclerView" android:layout_width="match_parent" android:layout_height="match_parent"/>
          </LinearLayout>
          EOF

          # 4. Player Screen Layout
          cat << 'EOF' > app/src/main/res/layout/activity_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#000000">
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:keepScreenOn="true"/>
          </FrameLayout>
          EOF

          # 5. Video Adapter (With Click Listener to open Player)
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/VideoAdapter.kt
          package com.app.mediaplayer
          import android.content.Intent
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class VideoAdapter(private val videoList: List<Video>) : RecyclerView.Adapter<VideoAdapter.VideoViewHolder>() {
              class VideoViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                  val tvTitle: TextView = itemView.findViewById(R.id.tvTitle)
                  val tvDuration: TextView = itemView.findViewById(R.id.tvDuration)
              }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VideoViewHolder {
                  val view = LayoutInflater.from(parent.context).inflate(R.layout.item_video, parent, false)
                  return VideoViewHolder(view)
              }
              override fun onBindViewHolder(holder: VideoViewHolder, position: Int) {
                  val video = videoList[position]
                  holder.tvTitle.text = video.title
                  val minutes = (video.duration / 1000) / 60
                  val seconds = (video.duration / 1000) % 60
                  holder.tvDuration.text = String.format("%02d:%02d", minutes, seconds)
                  
                  holder.itemView.setOnClickListener {
                      val intent = Intent(it.context, PlayerActivity::class.java)
                      intent.putExtra("VIDEO_PATH", video.path)
                      it.context.startActivity(intent)
                  }
              }
              override fun getItemCount() = videoList.size
          }
          EOF

          # 6. Player Activity (ExoPlayer Logic)
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/PlayerActivity.kt
          package com.app.mediaplayer
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_player)
                  
                  playerView = findViewById(R.id.playerView)
                  val videoPath = intent.getStringExtra("VIDEO_PATH")

                  if (videoPath != null) {
                      player = ExoPlayer.Builder(this).build()
                      playerView.player = player
                      val mediaItem = MediaItem.fromUri(videoPath)
                      player?.setMediaItem(mediaItem)
                      player?.prepare()
                      player?.play()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

          # 7. Main Activity (Permissions & List Logic)
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer
          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          class MainActivity : AppCompatActivity() {
              private lateinit var recyclerView: RecyclerView
              private val videoList = mutableListOf<Video>()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  recyclerView = findViewById(R.id.recyclerView)
                  recyclerView.layoutManager = LinearLayoutManager(this)
                  checkPermissions()
              }
              private fun checkPermissions() {
                  val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) Manifest.permission.READ_MEDIA_VIDEO else Manifest.permission.READ_EXTERNAL_STORAGE
                  if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(permission), 100)
                  } else {
                      loadVideos()
                  }
              }
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadVideos()
                  } else {
                      Toast.makeText(this, "Permission Denied!", Toast.LENGTH_LONG).show()
                  }
              }
              private fun loadVideos() {
                  val projection = arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.DISPLAY_NAME, MediaStore.Video.Media.DATA, MediaStore.Video.Media.DURATION)
                  val cursor = contentResolver.query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, projection, null, null, null)
                  cursor?.use {
                      val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val titleCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                      val pathCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                      val durationCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                      while (it.moveToNext()) {
                          videoList.add(Video(it.getLong(idCol), it.getString(titleCol) ?: "Unknown", it.getString(pathCol), it.getLong(durationCol)))
                      }
                  }
                  recyclerView.adapter = VideoAdapter(videoList)
              }
          }
          EOF

          # 8. Clean AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".PlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden" android:screenOrientation="fullSensor" />
              </application>
          </manifest>
          EOF
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Save Code
        if: success()
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@example.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Direct Fix: Fully Working Player + List" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
