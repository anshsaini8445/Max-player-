name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: NUCLEAR RESET (Force Delete Dummy UI)
        run: |
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # Zabardasti naya aur saaf layout daalna (Purana kachra overwrite)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0A0A0A">
              
              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Max Player - Clean Base Ready!"
                  android:textColor="#00FFCC"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:padding="20dp"/>
                  
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recyclerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </LinearLayout>
          EOF
          
          # Zabardasti saaf MainActivity daalna
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer
          
          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  Toast.makeText(this, "Success! Dummy UI Deleted.", Toast.LENGTH_LONG).show()
              }
          }
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MaxPlayer"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.app.mediaplayer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'androidx.media3:media3-session:1.3.0'
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.app.mediaplayer">
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet openai httpx

      - name: Run NVIDIA DeepSeek AI
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from openai import OpenAI
          import httpx

          API_KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          def compile_base_app(message="Base App Build"):
              print(f"\n--- {message} ---")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ BUILD SUCCESSFUL! Base APK generated.")
                  Path("agent_summary.txt").write_text("Nuclear Reset Applied. Base App Built.", encoding="utf-8")
                  sys.exit(0)
              else:
                  print("❌ BUILD FAILED.")
                  sys.exit(1)

          if not API_KEY: compile_base_app("Missing API Key")

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=API_KEY,
              http_client=httpx.Client(timeout=120.0)
          )
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle"}
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]
          
          prompt = f"""
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Files: {", ".join(files[:150])}
          Rule: Return ONLY valid JSON format with keys "summary" and "files".
          """
          
          model_name = "deepseek-ai/deepseek-v4.1-flash"
          response_text = None
          
          for retry in range(2):
              try:
                  print(f"Connecting to {model_name}...")
                  completion = client.chat.completions.create(
                      model=model_name,
                      messages=[{"role": "user", "content": prompt}],
                      temperature=0.1
                  )
                  response_text = completion.choices[0].message.content
                  break
              except Exception as e:
                  if retry == 0: time.sleep(5)
                      
          if not response_text:
              compile_base_app("NVIDIA Server Timeout")
              
          try:
              raw_text = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', response_text.strip())
              match = re.search(r"\{[\s\S]*\}", raw_text)
              data = json.loads(match.group(0) if match else raw_text)
              
              for item in data.get("files", []):
                  target = (PROJECT_DIR / item["filepath"]).resolve()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(item["content"], encoding="utf-8")
                  
              print("Compiling AI changes...")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              
              if build.returncode == 0:
                  print("✅ AI BUILD SUCCESSFUL!")
                  sys.exit(0)
              else:
                  compile_base_app("AI Code Error, Reverting to Nuclear Reset UI")
          except Exception as e:
              compile_base_app("Fallback after JSON Error")
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code & Delete HTML
        if: success()
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@example.com"
          
          cat << 'IGNORE_EOF' > .gitignore
          *.html
          build/
          app/build/
          .gradle/
          local.properties
          .idea/
          *.iml
          IGNORE_EOF
          
          git rm -r --cached *.html build/ app/build/ .gradle/ || true
          
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Fix: Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
